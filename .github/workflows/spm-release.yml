name: Release to SPM
on:
    workflow_dispatch:

jobs:
    update_spm:
        runs-on: ubuntu-latest
        steps:

          - name: Checkout main branch
            uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            with:
                ref: main

          - name: Fetch latest release from AttestIOS
            id: get_latest_release
            run: |
                LATEST_VERSION=$(curl -s https://api.github.com/repos/dequelabs/AttestIOS/releases/latest | jq -r '.tag_name')
                echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
                echo "version=$LATEST_VERSION"

