        if (impactValue >= IMPACT_LEVELS.SERIOUS) {
          return 0;
        } else if (impactValue === IMPACT_LEVELS.MODERATE) {
          maxScore = 40;
        } else if (impactValue === IMPACT_LEVELS.MINOR) {
          maxScore = Math.min(maxScore, 80);
        }
      }
    }
    return maxScore;
  }
  formatRuleTitle(ruleId) {
    if (!ruleId) return "Unknown rule";
    return ruleId.split("-").map((word) => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
  }
  capitalizeFirst(str) {
    if (!str) return "";
    return str.charAt(0).toUpperCase() + str.slice(1);
  }
  renderAnalyzedValues(props) {
    if (!props || Object.keys(props).length === 0) {
      return '<div class="code-container">No analyzed values available</div>';
    }
    const values = Object.entries(props).map(([key, value]) => {
      if (typeof value === "object") {
        return `${key}: ${JSON.stringify(value)}`;
      }
      return `${key}: ${value}`;
    }).join("\n");
    return `<div class="code-container">${values || "No analyzed values available"}</div>`;
  }
  getDocsLinkPath(os, ruleId) {
    let device = os;
    if (device === "iPadOS") {
      device = "iOS";
    }
    const devicePath = device.toLowerCase();
    return `/axe/${devicePath}/rule/${ruleId}`;
  }

                            <span class="stat-value" id="totalIssues">-</span>

                        <div class="stat-item">

                        <div class="stat-item">

                    <div class="filter-group" style="display: none;">
                        <span class="filter-label">View:</span>

                                <input type="radio" name="view" value="all" class="radio-input" checked>
                                <div class="radio-button">
                                    <div class="radio-dot"></div>
                                </div>
                                <span class="radio-label">All screens</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-group filter-by-section">
                        <span class="filter-label">Filter by:</span>
                        <div class="radio-group" id="impactFilter">
                            <label class="radio-wrapper">
                                <input type="radio" name="impact" value="all" class="radio-input" checked>
                                <div class="radio-button">
                                    <div class="radio-dot"></div>
                                </div>
                                <span class="radio-label">All impacts</span>
                            </label>
                            <label class="radio-wrapper">
                                <input type="radio" name="impact" value="critical" class="radio-input">
                                <div class="radio-button">
                                    <div class="radio-dot"></div>
                                </div>
                                <span class="radio-label">Critical</span>
                            </label>
                            <label class="radio-wrapper">
                                <input type="radio" name="impact" value="serious" class="radio-input">
                                <div class="radio-button">
                                    <div class="radio-dot"></div>
                                </div>
                                <span class="radio-label">Serious</span>
                            </label>
                            <label class="radio-wrapper">
                                <input type="radio" name="impact" value="moderate" class="radio-input">
                                <div class="radio-button">
                                    <div class="radio-dot"></div>
                                </div>
                                <span class="radio-label">Moderate</span>
                            </label>
                            <label class="radio-wrapper">

                                <div class="radio-button">
                                    <div class="radio-dot"></div>
                                </div>
                                <span class="radio-label">Minor</span>
                            </label>
                        </div>
                    </div>

                    <div class="separator separator-after-filter"></div>

                    <div id="screenList" class="screen-list active">
                        <div class="no-issues no-scans">
                            <div class="no-issues-heading">No scan results in this report</div>
                            <div class="no-issues-text">Import or add scan results to view your accessibility report.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
